baseURL: https://blog.smpaget.com
languageCode: en-US
title: smpaget blog
staticDir:
  - static
  - assets
theme: PaperMod
taxonomies:
  category: categories
  tag: tags
params:
  description: new words, old blog.
  defaultTheme: auto
  disableThemeToggle: true
  showSummary: true
  summaryLength: 30
  showShareButtons: true
  showReadingTime: true
  showToc: false
  showBreadCrumbs: true
  showCodeCopyButtons: true
  comments: true
  hideFooter: true
  assets:
    favicon: /favicon.ico
    disableHLJS: true
  author:
    name: admin
  hideDescriptionInList: false
  disableSpecial1stPost: true
markup:
  highlight:
    codeFences: true
    guessSyntax: true
    style: monokai
  goldmark:
    renderer:
      unsafe: true
outputs:
  home:
    - HTML
    - RSS
    - JSON
outputFormats:
  RSS:
    mediaType: application/rss+xml
    baseName: feed
menu:
  main:
menu:
  main:
    - name: home
      url: https://www.smpaget.com/
      weight: 1
    - name: youth work
      url: /categories/youthwork/
      weight: 2
    - name: theology
      url: /categories/theology/
      weight: 3
    - name: delightful intermissions
      url: /categories/delightful-intermissions/
      weight: 4
    - name: about
      url: https://www.smpaget.com/#about
      weight: 5
    - name: contact
      url: https://www.smpaget.com/#contact
      weight: 6
